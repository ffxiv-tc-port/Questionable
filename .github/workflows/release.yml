name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: 取 App token（runner 本機私鑰，private 子模組 checkout 用）
        id: app
        shell: pwsh
        run: |
          $keyPath = 'D:\ffxiv-tc-port\tctoolbox-app.pem'
          if (-not (Test-Path -LiteralPath $keyPath)) { throw "App private key not found on this runner: $keyPath" }
          function B64Url([byte[]]$b) { [Convert]::ToBase64String($b).TrimEnd('=').Replace('+', '-').Replace('/', '_') }
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $hdr = B64Url ([Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}'))
          $pl = B64Url ([Text.Encoding]::UTF8.GetBytes('{"iat":' + ($now - 60) + ',"exp":' + ($now + 540) + ',"iss":"4448133"}'))
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem((Get-Content -LiteralPath $keyPath -Raw))
          $sig = $rsa.SignData([Text.Encoding]::UTF8.GetBytes("$hdr.$pl"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $h = @{ Authorization = "Bearer $hdr.$pl.$(B64Url $sig)"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $inst = @(Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/app/installations') | Where-Object { $_.account.login -eq 'ffxiv-tc-port' }
          if (-not $inst) { throw 'App 4448133 has no installation on org ffxiv-tc-port' }
          $tok = (Invoke-RestMethod -Method Post -Headers $h -Uri "https://api.github.com/app/installations/$($inst[0].id)/access_tokens").token
          if (-not $tok) { throw 'installation access token is empty' }
          Write-Host "::add-mask::$tok"
          "token=$tok" >> $env:GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app.outputs.token }}
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pin = 'D:\ffxiv-tc-port\dalamud-pins\dalamud-pin-v13.0.0.17\dalamud-api13-net9.zip'
          if (-not (Test-Path -LiteralPath $pin)) { throw "pinned Dalamud not found on this runner: $pin" }
          Copy-Item -LiteralPath $pin -Destination dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release Questionable/Questionable.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './Questionable/dist/Questionable/Questionable.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to Questionable.zip
        shell: pwsh
        run: |
          # 直接指名輸出路徑，不要用 -Recurse 找 latest.zip：加了 GatheringPathRenderer
          # 之後同一棵樹底下會有兩個 latest.zip，萬用字元搜尋的順序不保證,撿錯一個就會把
          # GatheringPathRenderer 的資產包成 Questionable.zip。
          Copy-Item './Questionable/dist/Questionable/latest.zip' -Destination 'Questionable.zip'
      - name: Build with dotnet (GatheringPathRenderer)
        run: dotnet build --configuration Release GatheringPathRenderer/GatheringPathRenderer.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest (GatheringPathRenderer)
        shell: pwsh
        run: |
          $path = './GatheringPathRenderer/dist/GatheringPathRenderer/GatheringPathRenderer.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to GatheringPathRenderer.zip
        shell: pwsh
        run: |
          Copy-Item './GatheringPathRenderer/dist/GatheringPathRenderer/latest.zip' -Destination 'GatheringPathRenderer.zip'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Questionable.zip
            Questionable/dist/Questionable/Questionable.json
            GatheringPathRenderer.zip
            GatheringPathRenderer/dist/GatheringPathRenderer/GatheringPathRenderer.json
          generate_release_notes: true

